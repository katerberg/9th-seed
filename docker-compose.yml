version: '3.8'

services:
  mysqldb:
    image: mariadb:10.5.8
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQLDB_ROOT_PASSWORD
      - MYSQL_DATABASE=$MYSQLDB_DATABASE
    ports:
      - $MYSQLDB_LOCAL_PORT:$MYSQLDB_DOCKER_PORT
    networks:
      - backend
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - 80:80
      - $NODE_LOCAL_PORT:$NODE_LOCAL_PORT
    environment:
      - PUBLIC_PORT=$NODE_LOCAL_PORT
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - backend
  # No host ports so docker-rollout can run two copies during a deploy; Caddy fronts it
  http:
    depends_on:
      - mysqldb
    build: ./
    restart: unless-stopped
    env_file: ./.env
    environment:
      - DB_HOST=mysqldb
      - DB_USER=$MYSQLDB_USER
      - DB_PASSWORD=$MYSQLDB_ROOT_PASSWORD
      - DB_NAME=$MYSQLDB_DATABASE
      - DB_PORT=$MYSQLDB_DOCKER_PORT
      - FASTIFY_PORT=3000
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:3000/test']
      interval: 5s
      timeout: 3s
      retries: 3
    stdin_open: true
    tty: true
    networks:
      - backend
  twitch:
    depends_on:
      - mysqldb
    build:
      context: .
      dockerfile: Dockerfile-twitch
    restart: unless-stopped
    env_file: ./.env
    environment:
      - DB_HOST=mysqldb
      - DB_USER=$MYSQLDB_USER
      - DB_PASSWORD=$MYSQLDB_ROOT_PASSWORD
      - DB_NAME=$MYSQLDB_DATABASE
      - DB_PORT=$MYSQLDB_DOCKER_PORT
    stdin_open: true
    tty: true
    networks:
      - backend

networks:
  backend:
